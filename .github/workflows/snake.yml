
name: generate snake animation
 
on:
  schedule:
    - cron: "0 0 * * *"   # se regenera todos los días a medianoche UTC
  workflow_dispatch:        # permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generar github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%2300FF41&color_dots=%230D1F0D,%230D1F0D,%23008F11,%2300FF41,%23C7F9D4
 
      - name: publicar el svg en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
